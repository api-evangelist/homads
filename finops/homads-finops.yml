meters:
- name: payment_processing_fee
  description: >-
    Credit card transaction fee (reported at approximately 3%) applied per
    booking payment processed through the marketplace.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - booking
- name: api_usage
  description: >-
    Not applicable. Homads offers no public developer API, so there is no
    per-call or per-token usage meter.
  unit: requests
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: >-
    Track marketplace booking fees from Homads host payout statements; there is
    no API usage export because no public API is offered.
- name: Allocation
  description: >-
    Allocate transaction fees per property or booking; no API keys or per-call
    costs exist to allocate.
- name: Optimization
  description: >-
    Optimization applies to occupancy and pricing of mid-term listings, not API
    spend, since there is no metered API.
- name: Accountability
  description: >-
    Review per-property booking economics; no API budget owners are needed.
