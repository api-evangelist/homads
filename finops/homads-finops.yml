description: >-
  FinOps view of Homads. Homads is a mid-term rental marketplace, not a metered
  API product, so there is no usage-based API spend (no per-call, per-token, or
  per-request billing) to manage. The only recurring cost dimension is the
  marketplace transaction fee (reported at ~3% per payment) applied to bookings;
  listing, browsing, and messaging are free. Because no public developer API is
  offered, there are no API cost meters, invoices, or FOCUS-aligned usage records
  for programmatic consumption.
notes: >-
  Marketplace fee figures come from public summaries and may change; verify on
  homads.com during reconciliation. No public API spend exists to optimize.
