name: Homads
kind: company
description: Homads is an Austin-based mid-term rental marketplace connecting hosts
  and guests for furnished stays of 30 days or longer. The platform pairs rental
  listings with neighborhood-matching technology to help relocating professionals,
  travelers, and people in transition find a place to live. Homads is primarily a
  consumer and host web application; it does not publish a public developer API. Its
  rental inventory is exposed to property managers through channel-manager partners
  (for example Hostfully) via private connectivity, not a documented public API.
